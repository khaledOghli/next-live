name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20.9 is the floor Next 16 requires; 22 is the current LTS.
        node: ['20.9', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # The build must run before the tests: test/build.test.ts asserts the
      # shape of dist/, and skips itself when dist/ is absent. Without this
      # step those assertions would silently not run.
      - run: npm run build -w next-live

      - run: npm test -w next-live

      - run: npm run typecheck

      - run: npm run lint

      # Catches a Next-level regression the unit tests cannot see, such as the
      # 'use client' directive failing to survive into a real consumer build.
      - run: npm run build -w playground

      # Every stored snippet must still compile against the current SDK
      # surface. Without this, renaming a module breaks stored apps silently.
      - run: npm run validate:apps -w playground
