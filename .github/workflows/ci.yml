name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The published package's own floor is `engines.node` (>=20.9), but the
        # dev toolchain needs more: Vitest 5's rolldown imports `styleText` from
        # node:util, which landed in Node 20.12. So CI starts at the current
        # 20.x LTS rather than at the package floor.
        node: ['20.19', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run build -w next-live

      # Must precede typecheck: `next build` generates the route types the
      # playground relies on (LayoutProps and friends live in .next/types), so
      # typechecking first fails with "Cannot find name 'LayoutProps'".
      # It also catches Next-level regressions the unit tests cannot see, such
      # as the 'use client' directive failing to survive into a consumer build.
      - run: npm run build -w playground

      # Runs after the library build so test/build.test.ts asserts the published
      # shape instead of skipping itself.
      - run: npm test -w next-live

      - run: npm run typecheck

      - run: npm run lint

      # Every stored snippet must still compile against the current SDK
      # surface. Without this, renaming a module breaks stored apps silently.
      - run: npm run validate:apps -w playground
