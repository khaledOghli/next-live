name: Dependency review

# Blocks a pull request that introduces a dependency with a known advisory,
# before it is merged, rather than letting Dependabot find it afterwards.
on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4
        with:
          # Dev-only advisories are noisy on a package whose runtime dependency
          # list is a single entry; high and above is what should stop a merge.
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # The published package is MIT, and a copyleft dependency would make
          # that claim false.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-2.1
