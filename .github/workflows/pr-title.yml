name: PR title

# The repo follows Conventional Commits, and pull requests are squash-merged,
# so the PR title becomes the commit message on main. Release PRs use a
# structured "Release <package> <version>" title instead.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check the title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          conventional='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9 ._/-]+\))?!?: .{1,}$'
          semver='[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?'
          release="^Release [A-Za-z0-9._-]+ $semver( and [A-Za-z0-9._-]+ $semver)*$"
          if ! printf '%s' "$TITLE" | grep -Eq "$conventional|$release"; then
            echo "::error::PR title is not a Conventional Commit: $TITLE"
            echo "Expected e.g. 'fix(next-live): stop the editor losing focus on recompile'"
            echo "Or a release title like 'Release next-live 1.0.0 and next-live-docusaurus 1.0.0'"
            echo "Types: feat fix docs style refactor perf test build ci chore revert"
            exit 1
          fi
          echo "OK: $TITLE"
