name: PR title

# The repo follows Conventional Commits, and pull requests are squash-merged,
# so the PR title becomes the commit message on main. An unchecked title means
# the convention holds everywhere except the commits that actually land.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check the title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9 ._/-]+\))?!?: .{1,}$'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title is not a Conventional Commit: $TITLE"
            echo "Expected e.g. 'fix(next-live): stop the editor losing focus on recompile'"
            echo "Types: feat fix docs style refactor perf test build ci chore revert"
            exit 1
          fi
          echo "OK: $TITLE"
