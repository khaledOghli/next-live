# Push to `main` with a bumped version in packages/next-live/package.json and
# this publishes it, tags it, and opens the GitHub Release.
#
# The gate is the version itself, not the push. npm refuses to republish a
# version that already exists, so an unconditional publish-on-push turns `main`
# red on every docs commit and every merged Dependabot PR. `check` asks the
# registry what is already out there and skips silently when nothing is new,
# which makes the ordinary push a no-op and the release push a release.
name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build, test and pack, but do not publish'
        type: boolean
        default: true

permissions:
  contents: read

# Never let two publishes race for the same version.
concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      publish_next_live: ${{ steps.versions.outputs.publish_next_live }}
      publish_docusaurus: ${{ steps.versions.outputs.publish_docusaurus }}
      version_next_live: ${{ steps.versions.outputs.version_next_live }}
      version_docusaurus: ${{ steps.versions.outputs.version_docusaurus }}
    steps:
      - uses: actions/checkout@v4

      - name: Check package versions on npm
        id: versions
        run: |
          nl_version="$(node -p "require('./packages/next-live/package.json').version")"
          doc_version="$(node -p "require('./packages/next-live-docusaurus/package.json').version")"
          echo "version_next_live=$nl_version" >> "$GITHUB_OUTPUT"
          echo "version_docusaurus=$doc_version" >> "$GITHUB_OUTPUT"

          if [ -n "$(npm view "next-live@$nl_version" version 2>/dev/null || true)" ]; then
            echo "publish_next_live=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish_next_live=true" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$(npm view "next-live-docusaurus@$doc_version" version 2>/dev/null || true)" ]; then
            echo "publish_docusaurus=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish_docusaurus=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check
    if: >-
      needs.check.outputs.publish_next_live == 'true' ||
      needs.check.outputs.publish_docusaurus == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.dry-run == true)
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Require next-live changelog entry
        if: needs.check.outputs.publish_next_live == 'true'
        run: |
          version="${{ needs.check.outputs.version_next_live }}"
          if ! grep -q "^## \[$version\]" packages/next-live/CHANGELOG.md; then
            echo "::error::Missing changelog section ## [$version] in packages/next-live/CHANGELOG.md"
            exit 1
          fi

      - name: Require next-live-docusaurus changelog entry
        if: needs.check.outputs.publish_docusaurus == 'true'
        run: |
          version="${{ needs.check.outputs.version_docusaurus }}"
          if ! grep -q "^## \[$version\]" packages/next-live-docusaurus/CHANGELOG.md; then
            echo "::error::Missing changelog section ## [$version] in packages/next-live-docusaurus/CHANGELOG.md"
            exit 1
          fi

      - run: npm run build -w next-live
      - run: npm run build -w next-live-docusaurus
      - run: npm run build -w playground
      - run: npm test -w next-live
      - run: npm run check:package -w next-live
      - run: npm run check:package -w next-live-docusaurus
      - run: npm run typecheck
      - run: npm run lint

      - name: Show what would ship
        run: |
          npm pack --dry-run -w next-live
          npm pack --dry-run -w next-live-docusaurus

      - name: Verify next-live not yet on npm
        if: needs.check.outputs.publish_next_live == 'true' && inputs.dry-run != true
        run: |
          version="${{ needs.check.outputs.version_next_live }}"
          if [ -n "$(npm view "next-live@$version" version 2>/dev/null || true)" ]; then
            echo "::error::next-live@$version is already published"
            exit 1
          fi

      - name: Publish next-live
        if: needs.check.outputs.publish_next_live == 'true' && inputs.dry-run != true
        run: npm publish -w next-live --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify next-live-docusaurus not yet on npm
        if: needs.check.outputs.publish_docusaurus == 'true' && inputs.dry-run != true
        run: |
          version="${{ needs.check.outputs.version_docusaurus }}"
          if [ -n "$(npm view "next-live-docusaurus@$version" version 2>/dev/null || true)" ]; then
            echo "::error::next-live-docusaurus@$version is already published"
            exit 1
          fi

      - name: Publish next-live-docusaurus
        if: needs.check.outputs.publish_docusaurus == 'true' && inputs.dry-run != true
        run: npm publish -w next-live-docusaurus --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag and release next-live
        if: needs.check.outputs.publish_next_live == 'true' && inputs.dry-run != true
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version_next_live }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes "$(cat <<EOF
          ## Install

          \`\`\`bash
          npm install next-live@$VERSION
          \`\`\`

          See [the changelog](https://github.com/${{ github.repository }}/blob/main/packages/next-live/CHANGELOG.md).
          EOF
          )" \
            --verify-tag

      - name: Tag and release next-live-docusaurus
        if: needs.check.outputs.publish_docusaurus == 'true' && inputs.dry-run != true
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version_docusaurus }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "next-live-docusaurus@v$VERSION" -m "next-live-docusaurus@v$VERSION"
          git push origin "next-live-docusaurus@v$VERSION"
          gh release create "next-live-docusaurus@v$VERSION" \
            --title "next-live-docusaurus@v$VERSION" \
            --notes "$(cat <<EOF
          ## Install

          \`\`\`bash
          npm install next-live-docusaurus@$VERSION
          \`\`\`

          Requires \`next-live@^1\` and a Docusaurus 3.7+ site with \`@docusaurus/core\` and \`@docusaurus/theme-common\` installed.

          See [the changelog](https://github.com/${{ github.repository }}/blob/main/packages/next-live-docusaurus/CHANGELOG.md).
          EOF
          )" \
            --verify-tag
