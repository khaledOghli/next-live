name: Release

# Publishing is tag-driven: push a `v*` tag on `main` and this builds, tests,
# publishes to npm with provenance, then opens the GitHub Release.
#
# The tag is the single source of truth. The job refuses to publish if the tag
# does not match `packages/next-live/package.json`, so a forgotten version bump
# fails loudly instead of shipping the wrong number.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build and pack only, do not publish'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write # create the GitHub Release
      id-token: write # npm provenance attestation

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release notes need history

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Verify the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./packages/next-live/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match packages/next-live/package.json ($pkg)"
            exit 1
          fi

      - name: Verify the changelog has an entry
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## \[$version\]" packages/next-live/CHANGELOG.md; then
            echo "::error::no '## [$version]' section in packages/next-live/CHANGELOG.md"
            exit 1
          fi

      # Same order as CI: the library first, then the consumer build that
      # proves 'use client' survived, then the suite that asserts dist/ shape.
      - run: npm run build -w next-live
      - run: npm run build -w playground
      - run: npm test -w next-live
      - run: npm run typecheck
      - run: npm run lint

      - name: Pack and show what ships
        run: npm pack --dry-run -w next-live

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != true
        run: npm publish -w next-live --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "See [the changelog](https://github.com/${{ github.repository }}/blob/main/packages/next-live/CHANGELOG.md) for what changed in this release.

            \`\`\`bash
            npm install next-live@${GITHUB_REF_NAME#v}
            \`\`\`" \
            --verify-tag
